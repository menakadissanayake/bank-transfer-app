
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account Transaction History</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            padding: 25px;
            color: #263445;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        h1 {
            color: #17365d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e5eaf0;
        }

        th {
            background: #edf2f8;
        }

        .success {
            color: #15803d;
            font-weight: bold;
        }

        .failed {
            color: #dc2626;
            font-weight: bold;
        }

        .back-btn {
            display: inline-block;
            background: #1769aa;
            color: white;
            padding: 11px 18px;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Account Transaction History</h1>

    <p>
        Account Number:
        <strong th:text="${accountNumber}">100001</strong>
    </p>
<h3>
    Total Amount Sent:
    LKR <span th:text="${totalSent}"></span>
</h3>
    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Transaction ID</th>
                <th>From Account</th>
                <th>To Account</th>
                <th>Amount (LKR)</th>
                <th>Status</th>
                <th>Description</th>
                <th>Date</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="transaction : ${transactions}">

                <td th:text="${transaction.id}">1</td>

                <td th:text="${transaction.fromAccount}">100001</td>

                <td th:text="${transaction.toAccount}">100002</td>

                <td th:text="${#numbers.formatDecimal(transaction.amount, 1, 2)}">
                    5000.00
                </td>

                <td>
                    <span th:if="${transaction.status.name() == 'SUCCESS'}"
                          class="success">SUCCESS</span>

                    <span th:if="${transaction.status.name() == 'FAILED'}"
                          class="failed">FAILED</span>
                </td>

                <td th:text="${transaction.description}">Transfer completed</td>

                <td th:text="${#temporals.format(transaction.createdAt, 'yyyy-MM-dd HH:mm:ss')}">
                    2026-11-01
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(transactions)}">
                <td colspan="7">No transaction history found for this account.</td>
            </tr>

            </tbody>
        </table>
    </div>

    <a href="/" class="back-btn">Back to Dashboard</a>

</div>

</body>
</html>
